<main id="main" class="wrap inner-page">
  <header class="page-heading"><h1>主题预览</h1><p>选择一个主题应用到全站。</p><p><a href="/?theme=pixel">试用像素房间 ↗</a></p></header>
  <div class="theme-preview-grid">
    <button type="button" class="theme-preview-card" data-theme-choice="paper" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><strong>Paper White</strong><span>暖白纸页、衬线字体与细边框。</span></button>
    <button type="button" class="theme-preview-card" data-theme-choice="cyber" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><strong>Cyber Neon</strong><span>深色网格、霓虹边框与直角面板。</span></button>
    <button type="button" class="theme-preview-card" data-theme-choice="sakura" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><strong>Sakura Journal</strong><span>樱粉和草绿色的手账卡片。</span></button>
    <button type="button" class="theme-preview-card" data-theme-choice="glass" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><strong>Glass UI</strong><span>macOS 风格的毛玻璃浮层和彩色壁纸。</span></button>
    <button type="button" class="theme-preview-card" data-theme-choice="terminal" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><strong>Retro Terminal</strong><span>绿屏扫描线、等宽字与命令提示符。</span></button>
    <button type="button" class="theme-preview-card" data-theme-choice="pixel" aria-pressed="false"><span class="theme-swatch" aria-hidden="true"></span><strong>像素房间</strong><span>走进湖边的阁楼，点电脑、书架和工具箱逛博客。窗外的光随时间变化。</span></button>
  </div>
